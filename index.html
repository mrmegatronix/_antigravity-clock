<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYE Countdown 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="banner">
        JOIN US... From 8pm, Wednesday 31st December<br>
        <span class="banner-subtext"> - for our New Years Eve Karaoke Countdown Beach Party!</span>
    </div>

    <div class="sky-container" id="sky">
        <div class="celestial-body" id="celestial-body"></div>
        <div class="flying-container" id="flying-container"></div>
        <div class="stars"></div>
        <div class="clouds"></div>
    </div>

    <div class="scene-container">
        <!-- Ocean & Waves -->
        <div class="ocean">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>

        <!-- Beach -->
        <div class="beach">

            <!-- Tussock Grasses -->
            <div class="tussock tussock-1"></div>
            <div class="tussock tussock-2"></div>
            <div class="tussock tussock-3"></div>
            <div class="tussock tussock-4"></div>

        </div>

        <!-- Drinks Cart (outside beach to avoid clip-path) -->
        <img src="assets/drinks_cart.png" class="prop-cart">

        <!-- Palm Trees - Multiple for depth -->
        <!-- Far left palm -->


        <!-- Left main palm -->
        <div class="palm-tree left-tree">
            <svg viewBox="0 0 100 200" class="tree-svg">
                <path d="M46,200 Q52,140 54,70 Q46,140 46,200" fill="#4E342E" />
                <path d="M48,200 Q50,130 52,75 Q48,130 48,200" fill="#5D4037" />
                <circle cx="50" cy="78" r="4" fill="#8D6E63" />
                <circle cx="54" cy="82" r="3.5" fill="#6D4C41" />
                <circle cx="46" cy="81" r="3.5" fill="#795548" />
                <g fill="#1B5E20">
                    <path d="M50,75 Q5,55 -15,75 Q12,65 50,75" />
                    <path d="M50,75 Q95,55 115,75 Q88,65 50,75" />
                </g>
                <g fill="#2E7D32">
                    <path d="M50,75 Q15,50 0,65 Q22,60 50,75" />
                    <path d="M50,75 Q85,50 100,65 Q78,60 50,75" />
                    <path d="M50,75 Q50,30 45,15 Q55,40 50,75" />
                </g>
                <g fill="#388E3C">
                    <path d="M50,75 Q20,60 5,75 Q25,70 50,75" />
                    <path d="M50,75 Q80,60 95,75 Q75,70 50,75" />
                    <path d="M50,75 Q30,40 15,50 Q35,55 50,75" />
                    <path d="M50,75 Q70,40 85,50 Q65,55 50,75" />
                    <path d="M50,75 Q50,35 45,25 Q55,45 50,75" />
                    <path d="M50,75 Q40,50 25,40 Q45,55 50,75" />
                    <path d="M50,75 Q60,50 75,40 Q55,55 50,75" />
                </g>
                <g fill="#43A047">
                    <path d="M50,75 Q30,55 18,60 Q38,62 50,75" />
                    <path d="M50,75 Q70,55 82,60 Q62,62 50,75" />
                    <path d="M50,75 Q45,45 35,48 Q48,52 50,75" />
                    <path d="M50,75 Q55,45 65,48 Q52,52 50,75" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Right middle palm (background) -->
    <div class="palm-tree right-mid">
        <svg viewBox="0 0 100 200" class="tree-svg-mid">
            <path d="M47,200 Q51,135 53,80 Q47,135 47,200" fill="#5D4037" />
            <circle cx="50" cy="83" r="3" fill="#795548" />
            <circle cx="53" cy="86" r="2.5" fill="#6D4C41" />
            <g fill="#1B5E20" opacity="0.85">
                <path d="M50,80 Q5,60 -10,80 Q12,70 50,80" />
                <path d="M50,80 Q95,60 110,80 Q88,70 50,80" />
            </g>
            <g fill="#2E7D32" opacity="0.9">
                <path d="M50,80 Q15,65 0,80 Q20,72 50,80" />
                <path d="M50,80 Q85,65 100,80 Q80,72 50,80" />
                <path d="M50,80 Q35,45 20,50 Q40,60 50,80" />
                <path d="M50,80 Q65,45 80,50 Q60,60 50,80" />
                <path d="M50,80 Q50,40 48,25 Q52,50 50,80" />
                <path d="M50,80 Q40,50 25,55 Q42,58 50,80" />
                <path d="M50,80 Q60,50 75,55 Q58,58 50,80" />
            </g>
            <g fill="#388E3C" opacity="0.95">
                <path d="M50,80 Q30,55 15,60 Q35,62 50,80" />
                <path d="M50,80 Q70,55 85,60 Q65,62 50,80" />
                <path d="M50,80 Q50,45 48,32 Q52,52 50,80" />
            </g>
        </svg>
    </div>

    <!-- Right main palm (foreground) -->
    <div class="palm-tree right-main">
        <svg viewBox="0 0 100 200" class="tree-svg-main">
            <path d="M45,200 Q53,130 55,65 Q45,130 45,200" fill="#3E2723" />
            <path d="M47,200 Q51,125 53,70 Q47,125 47,200" fill="#4E342E" />
            <path d="M49,200 Q50,120 51,72 Q49,120 49,200" fill="#5D4037" />
            <circle cx="51" cy="75" r="5" fill="#8D6E63" />
            <circle cx="56" cy="80" r="4" fill="#6D4C41" />
            <circle cx="46" cy="79" r="4" fill="#795548" />
            <g fill="#0D3311">
                <path d="M51,72 Q-5,48 -20,72 Q5,60 51,72" />
                <path d="M51,72 Q107,48 122,72 Q97,60 51,72" />
            </g>
            <g fill="#1B5E20">
                <path d="M51,72 Q10,55 -5,72 Q15,65 51,72" />
                <path d="M51,72 Q92,55 107,72 Q87,65 51,72" />
                <path d="M51,72 Q25,25 8,38 Q32,42 51,72" />
                <path d="M51,72 Q77,25 94,38 Q70,42 51,72" />
            </g>
            <g fill="#2E7D32">
                <path d="M51,72 Q25,35 10,45 Q35,50 51,72" />
                <path d="M51,72 Q77,35 92,45 Q67,50 51,72" />
                <path d="M51,72 Q51,25 48,10 Q54,40 51,72" />
                <path d="M51,72 Q35,40 18,48 Q40,52 51,72" />
                <path d="M51,72 Q67,40 84,48 Q62,52 51,72" />
            </g>
            <g fill="#388E3C">
                <path d="M51,72 Q35,50 20,55 Q40,58 51,72" />
                <path d="M51,72 Q67,50 82,55 Q62,58 51,72" />
                <path d="M51,72 Q51,32 49,18 Q53,42 51,72" />
                <path d="M51,72 Q40,52 28,55 Q42,57 51,72" />
                <path d="M51,72 Q62,52 74,55 Q60,57 51,72" />
            </g>
            <g fill="#43A047">
                <path d="M51,72 Q42,55 32,58 Q45,60 51,72" />
                <path d="M51,72 Q60,55 70,58 Q57,60 51,72" />
                <path d="M51,72 Q48,48 40,50 Q50,55 51,72" />
                <path d="M51,72 Q54,48 62,50 Q52,55 51,72" />
            </g>
        </svg>
    </div>

    <!-- Entity Container (Crabs/Sharks/Boats) -->
    <div id="scene-entities"></div>
    </div>

    <div class="overlay">
        <div class="btn-container"
            style="position: absolute; top: 120px; right: 20px; display: flex; gap: 10px; z-index: 300;">
            <button id="reset-btn" class="preview-btn"
                style="position: relative; top: auto; right: auto; background: rgba(0, 255, 100, 0.2);">Current
                Time</button>
            <button id="preview-btn" class="preview-btn" style="position: relative; top: auto; right: auto;">Preview
                Midnight</button>
        </div>
        <div class="countdown-container">
            <h1 class="title">New Year's Eve Countdown</h1>
            <div class="timer" id="timer">
                <div class="time-unit">
                    <span id="days">00</span>
                    <label>Days</label>
                </div>
                <div class="time-unit">
                    <span id="hours">00</span>
                    <label>Hours</label>
                </div>
                <div class="time-unit">
                    <span id="minutes">00</span>
                    <label>Minutes</label>
                </div>
                <div class="time-unit">
                    <span id="seconds">00</span>
                    <label>Seconds</label>
                </div>
            </div>
            <h2 class="year-label">remaining until 2026</h2>

            <div class="extra-clocks">
                <!-- Sunrise -->
                <div class="clock-card">
                    <span class="clock-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffaa00" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            style="filter: drop-shadow(0 0 5px #ffaa00);">
                            <path d="M17 18a5 5 0 0 0-10 0"></path>
                            <line x1="12" y1="2" x2="12" y2="9"></line>
                            <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                            <line x1="1" y1="18" x2="3" y2="18"></line>
                            <line x1="21" y1="18" x2="23" y2="18"></line>
                            <line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line>
                            <line x1="23" y1="22" x2="1" y2="22"></line>
                            <polyline points="8 6 12 2 16 6"></polyline>
                        </svg>
                    </span>
                    <span id="sunrise-time">05:45</span>
                    <label>Sunrise</label>
                </div>

                <!-- Local Time -->
                <div class="clock-card main-local">
                    <span id="local-time">--:--:--</span>
                    <label>Christchurch Local Time</label>
                </div>

                <!-- Sunset -->
                <div class="clock-card">
                    <span class="clock-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fd746c" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            style="filter: drop-shadow(0 0 5px #fd746c);">
                            <path d="M17 18a5 5 0 0 0-10 0"></path>
                            <line x1="12" y1="9" x2="12" y2="2"></line>
                            <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                            <line x1="1" y1="18" x2="3" y2="18"></line>
                            <line x1="21" y1="18" x2="23" y2="18"></line>
                            <line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line>
                            <line x1="23" y1="22" x2="1" y2="22"></line>
                            <polyline points="12 9 12 2"></polyline>
                            <polyline points="16 5 12 9 8 5"></polyline>
                        </svg>
                    </span>
                    <span id="sunset-time">21:30</span>
                    <label>Sunset</label>
                </div>
            </div>
        </div>



        <!-- Custom CSS Sign Post (Vector Readable Text) -->
        <div class="sign-post-css">
            <div class="sign-pole"></div>
            <div class="sign-board sign-top">
                <span class="sign-text">WELCOME TO THE BEACH PARTY</span>
            </div>
            <div class="sign-board sign-mid">
                <span class="sign-text">SING A SONG</span>
            </div>
            <div class="sign-board sign-low">
                <span class="sign-text">GET A DRINK</span>
            </div>
        </div>

        <canvas id="fireworks-canvas"></canvas>

        <script src="script.js"></script>
</body>

</html>
